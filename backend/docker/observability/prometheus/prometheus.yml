global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "coding-analytics-api"
    metrics_path: /metrics
    static_configs:
      - targets:
          - api:3000

  - job_name: "postgres-exporter"
    static_configs:
      - targets:
          - postgres-exporter:9187